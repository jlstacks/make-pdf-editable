name: Package checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "43 9 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify required package files
        run: test -s SKILL.md && test -s agents/openai.yaml && test -s references/conversion-playbook.md
      - name: Check local Markdown links
        run: python scripts/check_links.py
