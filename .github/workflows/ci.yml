name: Package checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "43 9 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify required package files
        run: test -s SKILL.md && test -s agents/openai.yaml && test -s references/conversion-playbook.md
      - name: Check local Markdown links
        run: python scripts/check_links.py
